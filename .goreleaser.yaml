# Binary name "getaload" (renamed from "dmn"; see AGENTS.md rule 10).
# M3 adds: ECDSA signature of checksums.txt for go-selfupdate, a public releases repo, and the Docker image.
version: 2
before:
  hooks:
    # Licences of everything linked into the binary; fails on GPL/AGPL (AGENTS.md rule 3).
    - sh -c "sh scripts/third-party.sh > THIRD_PARTY_LICENSES.txt"
builds:
  - id: getaload
    main: ./cmd/getaload
    binary: getaload
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    flags: [-trimpath]
    # The Google client (repo secrets GDRIVE_CLIENT_ID/SECRET) is built in, so Drive works without set-up.
    ldflags: ["-s -w -X main.version={{.Version}} -X main.gdriveClientID={{ index .Env \"GDRIVE_CLIENT_ID\" }} -X main.gdriveClientSecret={{ index .Env \"GDRIVE_CLIENT_SECRET\" }}"]
archives:
  - formats: [tar.gz]
    # install.sh looks for getaload_<version>_linux_<arch>; go-selfupdate matches the _linux_<arch> suffix.
    name_template: "getaload_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files: [README*, THIRD_PARTY*]
checksum:
  name_template: checksums.txt
release:
  extra_files:
    - glob: scripts/install.sh
changelog:
  use: github
# checksums.txt is signed with the ECDSA release key (CI secret RELEASE_SIGNING_KEY, written to
# release-key.pem by the workflow); go-selfupdate verifies it against internal/update/release-key.pub.
signs:
  - artifacts: checksum
    cmd: openssl
    args: ["dgst", "-sha256", "-sign", "release-key.pem", "-out", "${signature}", "${artifact}"]
    signature: "${artifact}.sig"
