name: release
on:
  push: { tags: ["v*"] }
permissions: { contents: write, packages: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The full web client: the getaload_app Flutter web build at the version in internal/webui/APP_VERSION,
      # embedded into the binary (scripts/webapp.sh). Same step in the image job.
      - id: appver
        run: echo "ref=$(cat internal/webui/APP_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: sadatdaniel/getaload_app, ref: "${{ steps.appver.outputs.ref }}", path: app-src }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.5", channel: stable, cache: true }
      - name: web client
        run: |
          cd app-src && flutter pub get
          flutter build web --release --wasm --no-web-resources-cdn --dart-define=APP_VERSION="${{ steps.appver.outputs.ref }}"
          cd .. && sh scripts/webapp.sh app-src/build/web internal/webui/app && rm -rf app-src
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: release signing key
        run: printf "%s" "$KEY" > release-key.pem && chmod 600 release-key.pem
        env: { KEY: "${{ secrets.RELEASE_SIGNING_KEY }}" }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: { version: v2.18.3, args: release --clean } # exact GoReleaser, not "latest"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          # built into the binary (empty until the secrets exist: then the owner sets the client up in the app)
          GDRIVE_CLIENT_ID: "${{ secrets.GDRIVE_CLIENT_ID }}"
          GDRIVE_CLIENT_SECRET: "${{ secrets.GDRIVE_CLIENT_SECRET }}"
  # The previous release updates itself to this one through the real GitHub release (signature
  # checked against the embedded key). Proves the self-update path end to end on every release.
  update-e2e:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: previous release updates itself
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eux
          prev=$(gh release list -R "$REPO" --limit 2 --json tagName --jq '.[1].tagName')
          # Releases before the rename were "dmn"; they move over with install.sh, not by updating themselves.
          if ! gh release view "$prev" -R "$REPO" --json assets --jq '.assets[].name' | grep -q '^getaload_'; then
            echo "previous release $prev predates the getaload rename: nothing to update from"; exit 0
          fi
          gh release download "$prev" -R "$REPO" -p 'getaload_*_linux_amd64.tar.gz' -D old
          tar -xzf old/*.tar.gz -C old
          export GETALOAD_CONFIG=$PWD/c/config.yaml HOME=$PWD/h
          ./old/getaload setup --json > s.json
          export GETALOAD_TOKEN=$(jq -r .token s.json)
          ./old/getaload serve > serve.log 2>&1 &
          sleep 3
          ./old/getaload update check
          ./old/getaload update apply
          sleep 5
          ./old/getaload version | tee v.txt
          grep -qx "${GITHUB_REF_NAME#v}" v.txt
          test -f old/getaload.prev  # previous binary kept for rollback
  # Tier 1 image with every helper tool, for amd64, arm64 and armv7, on GHCR.
  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The full web client: the getaload_app Flutter web build at the version in internal/webui/APP_VERSION,
      # embedded into the binary (scripts/webapp.sh). Same step in the image job.
      - id: appver
        run: echo "ref=$(cat internal/webui/APP_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: sadatdaniel/getaload_app, ref: "${{ steps.appver.outputs.ref }}", path: app-src }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.5", channel: stable, cache: true }
      - name: web client
        run: |
          cd app-src && flutter pub get
          flutter build web --release --wasm --no-web-resources-cdn --dart-define=APP_VERSION="${{ steps.appver.outputs.ref }}"
          cd .. && sh scripts/webapp.sh app-src/build/web internal/webui/app && rm -rf app-src
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
