name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Helper tools for the video tests (they only use local pages and generated clips).
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          sudo curl -fsSL -o /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          sudo chmod +x /usr/local/bin/yt-dlp && yt-dlp --version
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with: { install-go: false }
      # Tests never touch the public network (loopback peers, DHT off), same as locally.
      # spike/ is a manual evidence suite (timing-sensitive under -race on small runners)
      - name: third-party licences (no GPL/AGPL linked)
        run: sh scripts/third-party.sh > /dev/null
      - run: CGO_ENABLED=1 go test -race -count=1 $(go list ./... | grep -v /spike/)
      - name: static cross-build
        run: |
          for a in amd64 arm64 arm; do CGO_ENABLED=0 GOARCH=$a GOARM=7 go build -o /tmp/getaload-$a ./cmd/getaload; done
          file /tmp/getaload-amd64 | grep -q "statically linked"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # install.sh end to end in a throwaway container: signature checks, install, upgrade, uninstall.
      - run: docker run --rm -v "$PWD:/src:ro" golang:1.26 sh /src/scripts/test-install.sh
