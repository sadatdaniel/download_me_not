name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1
        with: { install-go: false }
      # Tests never touch the public network (loopback peers, DHT off), same as locally.
      - run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: static cross-build
        run: |
          for a in amd64 arm64 arm; do CGO_ENABLED=0 GOARCH=$a GOARM=7 go build -o /tmp/dmn-$a ./cmd/dmn; done
          file /tmp/dmn-amd64 | grep -q "statically linked"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
