# Start:   docker compose up -d       (the first start prints your API token: docker compose logs getaload)
# Users:   docker compose exec getaload getaload user add NAME   (then sign in at https://<server-ip>:5623)
# Control: docker compose exec getaload getaload admin           (a one-time code for the app's Settings)
# Update:  docker compose pull && docker compose up -d
# Helper tools (yt-dlp, rclone, deno) also update themselves daily inside the data volume.
services:
  getaload:
    image: ghcr.io/sadatdaniel/getaload:latest
    build: .
    restart: unless-stopped
    ports:
      - "5623:5623"          # HTTPS, self-signed (the app shows the fingerprint once)
      - "42069:42069"        # torrents
      - "42069:42069/udp"
    volumes:
      - config:/config
      - data:/data
      - downloads:/downloads # or a host folder owned by uid 1000, e.g. /srv/media:/downloads
volumes:
  config:
  data:
  downloads:
