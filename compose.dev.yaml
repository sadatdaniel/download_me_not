# Dev environment. Nothing is installed on the host; Go runs here.
#   docker compose -f compose.dev.yaml run --rm go   go mod tidy      # has internet: module downloads only
#   docker compose -f compose.dev.yaml run --rm test go test ./...    # NO network at all (AGENTS.md rule 7)
name: dmn-dev

x-go: &go
  image: dmn-dev:latest
  build: { context: ., dockerfile: Dockerfile.dev }
  working_dir: /src
  volumes:
    - .:/src
    - dmn-gomod:/go/pkg/mod
    - dmn-gocache:/root/.cache/go-build
  environment:
    CGO_ENABLED: "0"

services:
  go:
    <<: *go
  test:
    <<: *go
    # Loopback only: torrent and download tests can never reach the internet.
    network_mode: none
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=mod
      GOPROXY: "off"

volumes:
  dmn-gomod:
    labels: { project: getaload }
  dmn-gocache:
    labels: { project: getaload }
